<svg viewBox="0 0 117 28" role="img" aria-label="XORA" xmlns="http://www.w3.org/2000/svg">
<!--
  xora-logo.svg — 共通ヘッダー用のロゴ本体(シンボル+ワードマーク)。
  header.js は本ファイルを<img>で読み込む(パスの単一情報源をここ1箇所にするため、
  header.js内にパスを二重管理しない)。

  2026-08-19 追加修正: ORAワードマーク部分のみを見本へ再トレース。
  シンボル(金/シアンの弧・中央の点、直前の一つ前の修正で合格済み)のpath dは
  この修正で1文字も変えていない(下の3行は前バージョンからのコピーそのまま)。

  なぜ直したか: 50%重ね(screenshots/logo-overlay.png)で見るとORAの3文字が
  見本とズレていた。原因は「実測が粗かった」のではなく、Rの構造そのものを
  誤解していたこと。旧実装はRの左側に縦棒を上から下まで1本通し、ボウルの右辺を
  直線にしていた。しかし見本を186x102pxのまま輝度しきい値(最大輝度の45%、
  にじみの中心線に相当)でサブピクセル境界を取ると、上バーと中央バーの間の
  左側(x101〜110相当)は完全に輝度0で、縦棒は中央バーからベースラインまでしか
  存在しない。上バーと中央バーを繋いでいるのは右側だけで、しかもそこは直線では
  なく緩やかに右へ膨らむ曲線だった(y方向に沿って中心線xが116.3→117.0(頂点)→116.0と
  弧を描く)。この「上バー/曲線/中央バー/(中央バーの左端から垂下する)縦棒/脚」という
  構造を取り違えていたのが主因で、座標を微調整するだけでは直らなかった。
  O・Aは実測値が旧実装とほぼ一致しており(O は半径を再計算して微修正、A は
  頂点・両端をサブピクセル単位で微調整のみ)、構造自体の誤りはなかった。

  測定手順(今回・ORAのみ再実施): assets/references/logo-official.png をPillowで
  読み込み、輝度=RGB平均。しきい値=最大輝度の45%を「にじみの中心線」とみなし、
  各行/各列についてしきい値を跨ぐ位置をサブピクセル線形補間で求めた
  (4近傍連結成分ラベリングで文字ごとのbboxを先に粗く切り出し、その後は行/列走査で
  細部を実測。前回コメントに書いた粗いbbox実測 O x[72,91] y[40,57] / R x[101,117]
  y[40,57] / A x[126,145] y[40,57] とほぼ整合)。
  座標はx-32, y-34で平行移動し(前回と同じオフセット。check.pyのcapture_logo_overlayが
  この値をハードコードして基準画像側のクロップ原点に使っているため、ここを動かすと
  重ね検証が壊れる)、そのままviewBox座標として使っている。

  文字ごとの実測値(基準画像ピクセル座標、括弧内はローカル座標=実測-32/-34):
    O: 中心(81.46,48.14)→(49.46,14.14) / 半径 rx=9.03 ry=8.32(いずれもストローク中心線、
       外側エッジと内側(穴)エッジのサブピクセル位置を4行4列で平均し往復で算出)
    R: 上バー y=39.0-41.0(中心40.0→ローカル6.00)、x=左端(縦棒と同じ) 〜 右端115.8
       中央バー y=47.55-49.55(中心48.55→ローカル14.55)、x=左端 〜 右端115.0
       縦棒(中央バーからベースラインまでのみ) x中心線101.28→ローカル69.28、
       y=48.55〜57.35(ローカル14.55〜23.35)
       右の曲線(上バー→中央バーを繋ぐ) 中心線xがy=42:116.29→y=44:116.96(頂点)→
       y=47:116.02 と弧を描く。三次ベジェで近似(下記path参照)。
       脚: 分岐点(111.9,48.55)→ローカル(79.9,14.55)、終点(117.1,57.35)→
       ローカル(85.1,23.35)。中央バー上のx=79.9(左端寄り)から分岐しベースライン右端へ。
    A: 頂点(見た目上の先端、丸い線結合で実際の頂点よりせり出す分を補正前)は
       ローカル(103.85,5.15)相当。丸い線結合(stroke-linejoin=round)は頂点を
       ストローク半幅(=1.0)ぶん外側へ膨らませるため、path自体の頂点座標は
       見た目の先端よりストローク半幅だけ内側(y+1.0)に置く必要がある
       (round joinは頂点を中心とした半径=ストローク半幅の円弧になるため)。
       →path頂点はローカル(103.75,6.15)を採用(左右対称なので円弧の膨らみは
       真上方向のみ、x座標は補正不要)。
       左脚ベースライン(94.2,57.35)→ローカル(94.20,23.35)、
       右脚ベースライン(145.3,57.35)→ローカル(113.30,23.35)。
       クロスバーは無し(中間の高さで左右の脚をサブピクセル走査しても2本のストローク
       以外に連続した塗りは存在しなかった)。

  最終微調整(+0.5,+0.4のオフセット): 上記の実測値をそのまま置いてcheck.pyの
  capture_logo_overlayと同じ経路(基準画像を6倍LANCZOS拡大→新SVGをブラウザで
  同倍率レンダリング→ORA部分だけRMSE算出)で検証すると、ORAのみRMSE=53.6だった。
  ここでx,yを一様に少しずつずらして再計算するグリッドサーチ(0.1刻み)をかけたところ、
  dx=+0.5,dy=+0.4でRMSE=43.7まで下がる、明確で滑らかな(隣接グリッドも単調に悪化する)
  極小点が見つかった。3文字がバラバラの方向にズレているのではなく揃って同じ方向に
  ズレていた=個々の文字の実測ミスではなく、「基準画像から直接読んだピクセル座標」と
  「check.pyのcrop→resizeを経由した後の座標」の間に系統的なサブピクセルのズレが
  乗っていたと考えられる(前回セッションのシンボル用オフセットOX,OY=32,34はシンボル側で
  校正されたものであり、ORAの文字列としての実際の版面位置がそこから微妙にずれていても
  不自然ではない)。そのため、以下のpath/ellipseの座標は「実測値にdx=+0.5,dy=+0.4を
  加えた最終値」になっている(上記の実測値そのものではない点に注意。実測値を再現したい
  場合はここから-0.5,-0.4すること)。

  ストローク太さ: O/R/Aとも実測でおよそ2.0(O:2.0前後、R:1.98〜2.09、A:2.0〜2.3、
  いずれもストローク幅=外側エッジ-内側エッジで算出)。シンボル側の1.9とは別の値として
  ORAだけstroke-width=2に統一した(シンボルのpathには一切触れていないため、この値の
  違いはシンボルの見た目に影響しない)。

  色: #F3F0E8(サイトのCSS変数xora-whiteと同一)。ORA部分は前回から変更なし。

  検証: assets/references/logo-official.png のロゴ部分を実寸クロップし、本SVGを
  同縮尺でレンダリングした画像と並べ、50%透過で重ねた3面比較画像を
  screenshots/logo-overlay.png に生成して輪郭のズレを確認している(check.pyの
  capture_logo_overlayで自動生成)。今回追加で文字ごとの拡大重ね
  (logo-overlay-O.png / -R.png / -A.png)も同スクリプトから生成し、
  文字単位でも輪郭が二重に見えないことを個別に確認している。
-->
<path d="M4.00,4.00 C15.33,8.40 15.33,19.60 4.00,24.00" fill="none" stroke="#D9A441" stroke-width="1.9" stroke-linecap="round"/>
<path d="M31.00,4.00 C19.67,8.40 19.67,19.60 31.00,24.00" fill="none" stroke="#21C7C7" stroke-width="1.9" stroke-linecap="round"/>
<circle cx="17.00" cy="14.00" r="2.00" fill="#21C7C7"/>
<ellipse cx="49.96" cy="14.54" rx="9.03" ry="8.32" fill="none" stroke="#F3F0E8" stroke-width="2"/>
<path d="M69.78,6.40 L84.30,6.40" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round"/>
<path d="M84.30,6.40 C86.40,9.25 85.60,12.10 83.50,14.95" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round"/>
<path d="M69.78,14.95 L83.50,14.95" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round"/>
<path d="M69.78,14.95 L69.78,23.75" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round"/>
<path d="M80.40,14.95 L85.60,23.75" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round"/>
<path d="M94.70,23.75 L104.25,6.55 L113.80,23.75" fill="none" stroke="#F3F0E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
